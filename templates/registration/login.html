{% extends 'base.html' %}

{% block title %}Iniciar Sesion - Biblioteca{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Iniciar Sesion</h2>
        <form method="post" class="mt-4">
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label">Email</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label for="{{ form.password.id_for_label }}" class="form-label">Contraseña</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary">Iniciar sesion</button>
        </form>
        <p class="mt-3">
            <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
        </p>
    </div>
</div>
{% endblock %}
