{% extends 'base.html' %}

{% block title %}Nueva Contraseña - Biblioteca{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Establecer Nueva Contraseña</h2>
        <form method="post" class="mt-4">
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.new_password1.id_for_label }}" class="form-label">Nueva contraseña</label>
                {{ form.new_password1 }}
            </div>
            <div class="mb-3">
                <label for="{{ form.new_password2.id_for_label }}" class="form-label">Confirmar nueva contraseña</label>
                {{ form.new_password2 }}
            </div>
            <button type="submit" class="btn btn-primary">Cambiar contraseña</button>
        </form>
    </div>
</div>
{% endblock %}
