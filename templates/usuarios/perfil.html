{% extends 'base.html' %}

{% block title %}Perfil - Biblioteca{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2>Mi Perfil</h2>
        <form method="post" class="mt-4">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="{{ form.first_name.id_for_label }}" class="form-label">Nombre</label>
                    {{ form.first_name }}
                </div>
                <div class="col-md-6 mb-3">
                    <label for="{{ form.last_name.id_for_label }}" class="form-label">Apellido</label>
                    {{ form.last_name }}
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="{{ form.email.id_for_label }}" class="form-label">Email</label>
                    {{ form.email }}
                </div>
                <div class="col-md-6 mb-3">
                    <label for="{{ form.telefono.id_for_label }}" class="form-label">Telefono</label>
                    {{ form.telefono }}
                </div>
            </div>
            <div class="mb-3">
                <label for="{{ form.fecha_nacimiento.id_for_label }}" class="form-label">Fecha de nacimiento</label>
                {{ form.fecha_nacimiento }}
            </div>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </form>
    </div>
</div>
{% endblock %}
